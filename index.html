<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>01 · Inicialização do Firebase</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card">
  <h1>Firebase + JavaScript Puro</h1>
  <p>Este exemplo apenas inicializa o Firebase e confirma a conexão com o projeto.</p>
  
  <div id="status" class="status-card">Conectando...</div>

  <p>
    <a href="exemplo.html" class="btn-login">Ir para a Tela de Login</a>
  </p>
</div>

<script type="module">
  import { app } from "./firebase-config.js";

  try {
    const projeto = app.options.projectId;
    document.querySelector("#status").innerHTML =
      `<span class="ok">Conectado com sucesso!</span><br>Projeto: ${projeto}`;
  } catch (erro) {
    document.querySelector("#status").innerHTML =
      `<span class="erro">Falha ao conectar.</span><br>${erro.message}`;
  }
</script>

</body>
</html>
